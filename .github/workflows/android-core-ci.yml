name: Android core CI

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-core-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run core unit tests and compile app
        run: gradle :core:testDebugUnitTest :app:assembleDebug --no-daemon
