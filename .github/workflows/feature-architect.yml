name: Feature Architect — Improvement Proposals

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus area (e.g. protocol, UX, efficiency, vehicle profiles)'
        required: false
        default: 'general'
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  propose-improvements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect repository signals
        id: signals
        run: |
          {
            echo "### Repository snapshot"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Focus: ${{ github.event.inputs.focus || 'scheduled/general' }}"
            echo ""
            echo "### Quick static signals"
            echo "- Kotlin/Java sources: $(find . -name '*.kt' -o -name '*.java' | grep -v build | wc -l)"
            echo "- TODO/FIXME: $(grep -r -i -E 'TODO|FIXME|HACK' --include='*.kt' --include='*.java' --include='*.md' . 2>/dev/null | wc -l || echo 0)"
            echo "- Workflows: $(ls .github/workflows 2>/dev/null | wc -l)"
            echo ""
            echo "### Existing AI / governance documents"
            ls -1 AI_*.md 2>/dev/null || echo "(none)"
          } > /tmp/signals.md
          cat /tmp/signals.md

      - name: Create Feature Architect proposal issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const signals = fs.readFileSync('/tmp/signals.md', 'utf8');
            const focus = '${{ github.event.inputs.focus || 'general' }}';
            const title = `[Feature Architect] Improvement proposals — ${focus} (${new Date().toISOString().slice(0,10)})`;

            const body = `
## Feature Architect — structured proposals (AutoDiag-WiCAN-Pro)

Opened by the **Feature Architect** workflow. Follows the 10-point format in \`AI_AGENT_REGISTRY.md\`.

**Focus:** \`${focus}\`

### Signals

${signals}

---

### Proposal template (fill one block per idea)

**1. Problem**  
...

**2. Proposed function**  
...

**3. User benefit**  
...

**4. Evidence / source**  
...

**5. Implementation location**  
...

**6. Dependencies**  
...

**7. Security / safety impact**  
...

**8. Test plan**  
...

**9. Real vehicle required?**  
Yes / No / Later

**10. Status**  
\`IDEA\` | \`PROPOSED\` | \`MODELED\` | \`IMPLEMENTED\` | \`VERIFIED\`

---

### Maintainer / AI instructions

1. Review signals and open issues.
2. Add filled 10-point proposals.
3. SECURITY_AGENT + EVIDENCE_AGENT review before implementation.
4. Prioritise by Priority model in AI_AGENT_REGISTRY.md.
5. Convert to concrete issues when ready.

*Generated by .github/workflows/feature-architect.yml*
`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['feature-architect', 'enhancement', 'needs-triage']
            });
            console.log(`Created issue #${issue.data.number}`);
