name: Outlander 2101 sidecar

on:
  push:
    branches: ["sidecar/outlander-2101-monitor"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :outlander2101:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: outlander2101-debug-apk
          path: android/outlander2101/build/outputs/apk/debug/outlander2101-debug.apk
          if-no-files-found: error
